<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To My Lovely Kunjj ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff6a88, #ff99ac);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.95);
      padding: 30px;
      border-radius: 25px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: fadeIn 2s ease;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 48px;
      color: #e91e63;
      margin-bottom: 10px;
    }

    .letter {
      font-size: 16px;
      color: #444;
      margin: 20px 0;
      line-height: 1.6;
      font-style: italic;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
      margin: 8px;
      transition: transform 0.3s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .music {
      background: #ff4081;
      color: white;
    }

    .share {
      background: #25D366;
      color: white;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh); opacity: 0; }
      to { transform: translateY(-10vh); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    img {
      margin-top: 15px;
      width: 140px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>To My Lovely Kunjj ❤️</h1>

    <div class="letter">
      My Kunj,  
      I won’t live without you.  
      I can’t live without you.  
      You are my heartbeat, my peace, my forever.  
      Every smile of mine begins with you 💕
    </div>

    <button class="music" onclick="playSong()">Play Our Song 🎵</button>
    <button class="share" onclick="shareWhatsApp()">Share on WhatsApp 💌</button>

    <p style="margin-top:15px; font-size:14px;">Scan this QR to open 💖</p>
    <img id="qr" alt="QR Code">
  </div>

  <!-- Background Music -->
  <audio id="song">
    <source src="https://docs.google.com/uc?export=download&id=1JeeneLagaHoonDemo" type="audio/mpeg">
  </audio>

  <script>
    function playSong() {
      document.getElementById("song").play();
    }

    function shareWhatsApp() {
      const text = "To My Lovely Kunjj ❤️\n\nMy Kunj, I won’t live without you. I can’t live without you 💕\n\nOpen this surprise:";
      const url = window.location.href;
      window.open(`https://wa.me/?text=${encodeURIComponent(text + " " + url)}`);
    }

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }, 500);

    // QR Code Generator
    const pageUrl = window.location.href;
    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(pageUrl);
  </script>

</body>
</html>
